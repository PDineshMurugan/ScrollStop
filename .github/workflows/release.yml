name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION_NAME="${TAG_NAME#v}"
          else
            TAG_NAME="v1.0.${COMMIT_COUNT}"
            VERSION_NAME="1.0.${COMMIT_COUNT}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "Building ScrollStop version: $VERSION_NAME (tag: $TAG_NAME, code: $COMMIT_COUNT)"

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ steps.version.outputs.count }} -PversionName=${{ steps.version.outputs.version }} --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/scrollstop.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/scrollstop-${{ steps.version.outputs.tag }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrollstop-apk
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ScrollStop ${{ steps.version.outputs.tag }}"
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
